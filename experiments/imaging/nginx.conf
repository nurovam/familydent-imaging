events {}
http {
  access_log off;
  server {
    listen 80;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'" always;
    location /dicom-web/ { proxy_pass http://gateway:8000; proxy_set_header Host $http_host; proxy_buffering off; }
    location /demo { proxy_pass http://gateway:8000; proxy_set_header Host $http_host; }
    location / { proxy_pass http://ohif:80; }
  }
}
